# Claude dans GitHub : écrire « @claude » dans une issue ou une pull request pour lui confier une tâche
# (par exemple une demande de vidéo ouverte avec le modèle « Demande de vidéo »). Claude suit alors
# .claude/CLAUDE.md, les agents et les skills de ce dépôt.
# Mise en place, une fois : installer l'application GitHub Claude (https://github.com/apps/claude) puis
# ajouter dans Settings → Secrets and variables → Actions le secret CLAUDE_CODE_OAUTH_TOKEN
# (commande « claude setup-token ») ou ANTHROPIC_API_KEY. Sans secret, le job échoue en quelques secondes.
# Les fichiers d'une issue (liens Google Drive) doivent être partagés « Tous les utilisateurs disposant du lien ».
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

# Une seule exécution à la fois par issue ou PR (évite deux Claude sur la même demande).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/video-setup
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sans ces outils, Claude ne peut que lire le dépôt : il lui faut le terminal (ffmpeg, Python,
          # rendu Playwright), l'écriture de fichiers et la recherche web pour la veille marketing.
          claude_args: >-
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebSearch,WebFetch,Task"
            --max-turns 200
