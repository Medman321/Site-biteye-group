# Claude dans GitHub : écrire « @claude » dans une issue ou une pull request pour lui confier une tâche
# (par exemple une demande de vidéo ouverte avec le modèle « Demande de vidéo »). Claude suit alors
# .claude/CLAUDE.md, les agents et les skills de ce dépôt.
# Mise en place, une fois : dans Claude Code, lancer /install-github-app (installe l'application GitHub
# Claude et ajoute le secret CLAUDE_CODE_OAUTH_TOKEN), ou ajouter un secret ANTHROPIC_API_KEY.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/video-setup
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
