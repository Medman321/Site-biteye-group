<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@600;700&family=Caveat:wght@600;700&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* BitEye motion engine. One stage (W×H from the storyboard) scaled to fit, player bar under it.
   Single dark brand look: forest + lime. Every animation is a pure function of time t (render(t)). */
:root{
  --forest:#0F1A14; --deep:#0A120D; --ink:#F2EFE8; --dim:rgba(242,239,232,.32); --soft:rgba(242,239,232,.7);
  --lime:#C4EF4E; --lime-deep:#2F6A1F; --lime-glow:rgba(196,239,78,.35); --on-lime:#0F1A14;
  --glass:rgba(242,239,232,.06); --line:rgba(242,239,232,.14); --paper:#F7F5F0; --paper-2:#E9E5DB; --paper-ink:#101411; --paper-dim:#5C6359; --paper-line:#E3DFD5;
  --display:"Inter Tight","Inter",system-ui,sans-serif;
  --text:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --arabic:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive; --hand-ar:"Aref Ruqaa","IBM Plex Sans Arabic",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--text);margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:12px;box-sizing:border-box}
.frame{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.5);flex:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--forest);overflow:hidden;font-family:var(--display);color:var(--ink)}
#stage *{box-sizing:border-box}
.a{opacity:0;will-change:transform,opacity}

/* background */
#glow{position:absolute;left:50%;top:43%;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;
  background:radial-gradient(circle,rgba(196,239,78,.20) 0%,rgba(196,239,78,.06) 35%,transparent 65%)}
#grid{position:absolute;inset:-60px;background-image:radial-gradient(rgba(242,239,232,.10) 1.6px,transparent 1.7px);background-size:60px 60px}
#scenes{position:absolute;inset:0;transform-origin:50% 50%}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(5,9,7,.75) 100%);pointer-events:none}

/* scenes */
.scene{position:absolute;inset:0;visibility:hidden}
.scene .bgm{position:absolute;inset:0;overflow:hidden}
.scene .bgm img,.scene .bgm video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.scene .bgm .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,13,.55),rgba(10,18,13,.35) 40%,rgba(10,18,13,.85))}
.scene .box{position:absolute;left:60px;right:60px;display:flex;align-items:center;justify-content:center}
.scene .inner{display:flex;flex-direction:column;align-items:center;gap:30px;width:100%;transform-origin:50% 50%;text-align:center}
.scene.left .inner{align-items:flex-start;text-align:left}
.scene .inner.split{flex-direction:row;align-items:center;gap:80px}
.scene .inner.split>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:inherit;align-items:flex-start;text-align:left}
.scene .inner.split>.col+.col{align-items:center}

/* brand bar */
#brand{position:absolute;left:60px;top:80px;display:flex;align-items:center;gap:18px;font-weight:700;font-size:34px;letter-spacing:-.01em;z-index:5}
#brand small{font-family:var(--text);font-weight:500;font-size:22px;color:var(--dim);margin-left:6px}

/* captions + waveform */
#cap{position:absolute;left:60px;right:60px;padding:28px 40px;border-radius:34px;background:rgba(10,18,13,.78);
  border:1px solid var(--line);text-align:center;font-weight:700;font-size:58px;line-height:1.22;letter-spacing:-.015em;z-index:6}
#cap span{display:inline-block;margin:0 .13em;color:rgba(242,239,232,.26)}
#cap span.past{color:var(--ink)}
#cap span.now{color:var(--lime);transform:scale(1.08)}
#cap.rtl{direction:rtl;font-family:var(--arabic)}
#wave{position:absolute;left:0;right:0;height:120px;display:flex;align-items:center;justify-content:center;gap:9px;z-index:6}
#wave i{display:block;width:9px;border-radius:5px;background:var(--lime);opacity:.85}

/* blocks */
.lime{color:var(--lime)}
.headline{font-weight:800;letter-spacing:-.035em;line-height:.98;text-wrap:balance;margin:0}
.headline.italic{font-style:italic}
.eyebrow{font-family:var(--text);font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--lime);font-size:32px}
.body{font-family:var(--text);font-weight:500;font-size:44px;line-height:1.3;color:var(--soft);max-width:900px;text-wrap:balance}
.arabic{font-family:var(--arabic);font-weight:700;font-size:190px;line-height:1.2;direction:rtl}
.letters span{display:inline-block}
.chip{display:inline-flex;align-items:center;gap:20px;padding:22px 36px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:40px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.chips span{font-family:var(--text);font-size:28px;font-weight:600;padding:14px 26px;border-radius:999px;border:1px solid var(--line);color:rgba(242,239,232,.85)}
.cards{display:flex;gap:40px;justify-content:center;align-items:center;width:100%;position:relative}
.card{flex:1;max-width:450px;min-height:560px;border-radius:40px;background:var(--glass);border:1px solid var(--line);padding:36px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;text-align:left;position:relative}
.card .ill{position:absolute;left:0;right:0;top:44px;display:flex;justify-content:center}
.card .k{font-family:var(--text);font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:600}
.card .t{font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1}
.card .d{font-family:var(--text);font-size:26px;color:var(--soft);line-height:1.3}
.sep{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:800;font-size:36px;box-shadow:0 0 0 14px var(--forest);z-index:2}
.pillars{display:flex;flex-direction:column;gap:30px;width:100%}
.pil{width:100%;min-height:200px;border-radius:34px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;gap:34px;padding:28px 40px;text-align:left}
.pil .ic{width:120px;height:120px;border-radius:28px;background:var(--lime);display:grid;place-items:center;flex:none}
.pil b{display:block;font-size:58px;font-weight:800;letter-spacing:-.03em}
.pil em{display:block;font-style:normal;font-family:var(--text);font-size:29px;color:var(--soft);margin-top:8px;line-height:1.3}
.checklist{display:flex;flex-direction:column;width:100%;max-width:880px}
.li{min-height:100px;display:flex;align-items:center;gap:30px;font-size:46px;font-weight:700;letter-spacing:-.02em;border-bottom:1px solid var(--line);text-align:left}
.li .bx{width:62px;height:62px;border-radius:18px;border:3px solid var(--line);display:grid;place-items:center;flex:none}
.li .bx svg{opacity:0}
.tiles{position:relative;width:960px;max-width:100%}
.tile{position:absolute;left:0;top:0;width:290px;height:160px;border-radius:26px;background:var(--paper);color:var(--paper-ink);padding:24px 26px;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:left}
.tile b{font-size:38px;font-weight:800;letter-spacing:-.02em}
.tile em{font-style:normal;font-family:var(--text);font-size:21px;color:var(--paper-dim);font-weight:500}
.tile .chk{position:absolute;right:20px;top:20px;width:44px;height:44px;border-radius:50%;background:var(--forest);display:grid;place-items:center;opacity:0}
.stats{display:flex;gap:24px;width:100%;justify-content:center;flex-wrap:wrap}
.stat{flex:1;min-width:260px;max-width:460px;border-radius:30px;background:var(--glass);border:1px solid var(--line);padding:30px 34px;text-align:left}
.stat b{display:block;font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--lime)}
.stat b span{font-size:40px;color:var(--ink)}
.stat small{display:block;font-family:var(--text);font-size:28px;color:var(--soft);margin-top:12px;font-weight:500}
.app{width:960px;max-width:100%;border-radius:36px;background:var(--paper);color:var(--paper-ink);overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.55);font-family:var(--text);text-align:left}
.app .bar{height:70px;background:var(--paper-2);display:flex;align-items:center;gap:12px;padding:0 28px;font-size:22px;font-weight:600;color:#4A5248}
.app .bar i{width:16px;height:16px;border-radius:50%;background:#CFC8B8;display:block}
.app .bar span{margin-left:16px}
.app .bd{display:flex}
.app .side{width:190px;background:var(--forest);padding:30px 20px;display:flex;flex-direction:column;gap:14px;flex:none}
.app .side div{height:46px;border-radius:12px;background:rgba(242,239,232,.07);font-size:19px;color:rgba(242,239,232,.7);display:flex;align-items:center;padding-left:16px;font-weight:500}
.app .side div.on{background:var(--lime);color:var(--on-lime);font-weight:700}
.app .main{flex:1;min-width:0;padding:36px 40px;display:flex;flex-direction:column;gap:26px}
.app h3{margin:0;font-family:var(--display);font-size:46px;letter-spacing:-.03em;font-weight:800}
.app .sub{font-size:22px;color:var(--paper-dim);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{background:#fff;border:1px solid var(--paper-line);border-radius:22px;padding:20px;min-width:0}
.kpi small{display:block;font-size:17px;color:var(--paper-dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font-family:var(--display);font-size:48px;font-weight:800;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b span{font-size:22px;color:var(--paper-dim);font-weight:700}
.bars{background:#fff;border:1px solid var(--paper-line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:22px}
.bars .ttl{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-dim)}
.bar-row{display:grid;grid-template-columns:250px 1fr 76px;align-items:center;gap:16px;font-size:22px;font-weight:600}
.bar-row .tr{height:20px;border-radius:10px;background:#EEEAE1;overflow:hidden}
.bar-row .tr i{display:block;height:100%;width:0;border-radius:10px;background:var(--lime-deep)}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:800}
.media{position:relative;width:100%;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);background:#000}
.media img,.media video{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.media .lbl{position:absolute;left:24px;bottom:24px;padding:12px 22px;border-radius:999px;background:rgba(10,18,13,.78);font-size:28px;font-weight:700;color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;width:100%}
.gallery .media{border-radius:28px}
.logo{display:block}
.logo path{stroke-dasharray:60}
.wordmark{font-weight:800;letter-spacing:-.035em;font-size:112px;line-height:1}
.cta{background:var(--lime);color:var(--on-lime);font-size:48px;font-weight:800;padding:30px 60px;border-radius:999px;letter-spacing:-.02em;box-shadow:0 0 60px var(--lime-glow)}
.url{font-size:46px;font-weight:700;letter-spacing:-.01em}
.quote{font-size:64px;font-weight:700;letter-spacing:-.02em;line-height:1.15;max-width:920px;text-wrap:balance}
.quote small{display:block;font-family:var(--text);font-size:30px;font-weight:500;color:var(--soft);margin-top:24px;letter-spacing:0}
.ring{position:absolute;left:50%;top:45%;border-radius:50%;border:4px solid var(--lime);pointer-events:none}
.flag{display:block}

/* human touch */
.note{font-family:var(--hand);font-weight:700;font-size:72px;line-height:1.05;color:var(--lime);transform-origin:50% 50%}
.note.ar{font-family:var(--hand-ar);direction:rtl}
.note.ink{color:var(--ink)}
.markwrap{position:relative;display:inline-block}
.markwrap>svg.mark{position:absolute;left:-6%;top:-18%;width:112%;height:136%;overflow:visible;pointer-events:none}
.markwrap>svg.mark path{fill:none;stroke:var(--lime);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.polaroid{background:#F7F5F0;padding:22px 22px 0;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.45);width:100%}
.polaroid .media{border-radius:2px;box-shadow:none}
.polaroid .cap{font-family:var(--hand);font-weight:700;font-size:52px;color:#1b231d;text-align:center;padding:14px 0 18px}
.tape{position:absolute;left:50%;top:-22px;width:170px;height:46px;margin-left:-85px;background:rgba(242,239,232,.55);transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sticker{display:inline-block;background:var(--lime);color:var(--on-lime);font-weight:800;font-size:44px;padding:16px 30px;border-radius:14px;box-shadow:0 10px 0 rgba(0,0,0,.25);letter-spacing:-.01em}
.chat{display:flex;flex-direction:column;gap:18px;width:100%;max-width:900px;font-family:var(--text)}
.bub{max-width:82%;padding:22px 28px 14px;border-radius:30px;font-size:46px;line-height:1.3;text-align:left;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bub.in{align-self:flex-start;background:#F7F5F0;color:#101411;border-bottom-left-radius:8px}
.bub.out{align-self:flex-end;background:#D9FDD3;color:#0b1b0f;border-bottom-right-radius:8px}
.bub small{display:block;text-align:right;font-size:20px;opacity:.55;margin-top:6px}
.bub .who{display:block;font-size:22px;font-weight:700;color:var(--lime-deep);margin-bottom:4px}
.typing{display:inline-flex;gap:8px;padding:22px 28px;border-radius:30px;background:#F7F5F0;align-self:flex-start}
.typing i{width:14px;height:14px;border-radius:50%;background:#7b827a;display:block}
.typer{font-family:var(--text);font-weight:600;font-size:52px;text-align:left;white-space:pre-wrap}
.typer .cur{display:inline-block;width:.08em;height:1em;background:var(--lime);vertical-align:-.12em;margin-left:.04em}
.lower{display:flex;align-items:center;gap:22px;background:rgba(10,18,13,.82);border:1px solid var(--line);border-radius:22px;padding:18px 28px 18px 18px;text-align:left}
.lower .av{width:84px;height:84px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:800;font-size:36px;color:var(--on-lime);overflow:hidden;flex:none}
.lower .av img{width:100%;height:100%;object-fit:cover}
.lower b{display:block;font-size:40px;font-weight:800}
.lower span{display:block;font-family:var(--text);font-size:26px;color:var(--soft)}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.10;mix-blend-mode:overlay;z-index:8;background-size:256px 256px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}

/* landscape tweaks */
#stage.land .cards{gap:60px}
#stage.land .pillars{flex-direction:row}
#stage.land .pil{flex-direction:column;align-items:flex-start;min-height:0}
#stage.land .checklist{display:grid;grid-template-columns:1fr 1fr;column-gap:60px;max-width:1500px}
#stage.land .app{width:1300px}
#stage.land .gallery{grid-template-columns:repeat(3,1fr)}

/* player */
#big{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,18,13,.35);border:0;cursor:pointer;color:var(--ink);font:inherit;z-index:20}
#big span{display:flex;align-items:center;gap:14px;background:var(--lime);color:var(--on-lime);font-family:var(--display);font-weight:800;font-size:20px;padding:16px 26px;border-radius:999px;box-shadow:0 0 40px var(--lime-glow)}
#big:focus-visible,.ctl button:focus-visible,#prog:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.ctl{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;font-size:13px;color:rgba(242,239,232,.75);font-variant-numeric:tabular-nums}
.ctl button{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center}
#prog{flex:1;min-width:0;accent-color:#C4EF4E}
body.render .ctl,body.render #big{display:none}
body.render{padding:0}
body.render .wrap{display:block;padding:0}
body.render .frame{border-radius:0;box-shadow:none}
</style>

<div class="wrap">
<div class="frame" id="frame">
  <div id="stage" aria-label="__TITLE__"><div id="grid"></div><div id="glow"></div><div id="vignette"></div><div id="scenes"></div></div>
  <button id="big" type="button" aria-label="Lire la vidéo avec le son"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Lire avec le son</span></button>
</div>
<div class="ctl">
  <button id="pp" type="button" aria-label="Lecture"><svg id="ppi" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
  <input id="prog" type="range" min="0" max="10" step="0.01" value="0" aria-label="Position dans la vidéo">
  <span id="tc">0:00</span>
  <button id="rs" type="button" aria-label="Recommencer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/></svg></button>
</div>
</div>
<audio id="voice" preload="auto"></audio>

<script>
const CFG = /*__CONFIG__*/null;
const MEDIA = /*__MEDIA__*/{};
const W = CFG.width, H = CFG.height, DUR = CFG.duration, LAND = W > H;
const AUD = CFG.audio ? CFG.audio.duration : 0, ENV = CFG.env || [], FPS_ENV = 30;
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b,Math.max(a,x));
const p = (t,a,b) => b<=a ? (t>=a?1:0) : clamp((t-a)/(b-a));
const outExpo = x => x>=1 ? 1 : 1-Math.pow(2,-10*x);
const outBack = x => { const c1=1.5, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const inOut = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const lerp = (a,b,k) => a+(b-a)*k;
const envAt = t => ENV[Math.floor(t*FPS_ENV)] || 0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Text markup: *mot* → lime, \n → line break. */
const mk = s => esc(s).replace(/\*([^*]+)\*/g,'<span class="lime">$1</span>').replace(/\n/g,'<br>');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const src = k => MEDIA[k] || k;

/* ---------- Icons (24×24 strokes, drawn on lime tiles) ---------- */
const ICONS = {
  chart:'<path d="M3 20h18M6 16V10M11 16V6M16 16v-4M20 8l-4-4-3 3"/>',
  building:'<path d="M2 20h20M5 20V9l7-5 7 5v11M9 20v-6h6v6"/>',
  tower:'<path d="M4 21h16M7 21V3h10v18M10 7h1M13 7h1M10 11h1M13 11h1M10 15h1M13 15h1"/>',
  crane:'<path d="M4 21h6M7 21V4M7 4h14M7 4l4 0-4 4M18 4v6M16 10h4v3h-4z"/>',
  doc:'<path d="M6 2h9l4 4v16H6zM14 2v5h5M9 12h7M9 16h7"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.6 4 2.8 4 6"/>',
  wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H3zM3 7l12-4v4M16 13h2"/>',
  calendar:'<path d="M3 5h18v16H3zM3 10h18M8 3v4M16 3v4"/>',

/* Shrink a scene whose content is taller or wider than its box. */

let brandEl = null;
if (CFG.brand !== false) {
  brandEl = el('div','a', `${LOGO(56)}VISION Workspace<small>par BitEye</small>`); brandEl.id = 'brand'; if (SAFE) brandEl.style.top = '150px'; stage.appendChild(brandEl);
}
const BRAND_SPANS = CFG.brandSpans || [[.3, DUR - 4]];

/* ---------- Captions ---------- */
const capEl = el('div','a'); capEl.id = 'cap'; capEl.style.top = capTop+'px'; if (LAND) { capEl.style.left = capEl.style.right = Math.max(60,(W-1500)/2)+'px'; capEl.style.fontSize='50px'; }
if (CFG.captions && CFG.captions.rtl) capEl.classList.add('rtl');
if (CAP_ON) stage.appendChild(capEl);
const PHRASES = CAP_ON ? CFG.captions.phrases : [];
let capIdx = -2;
function phraseSpan(i) {

}

  if (idx !== capIdx) { capIdx = idx; capEl.innerHTML = idx < 0 ? '' : PHRASES[idx].map(w => `<span>${esc(w[0])}</span>`).join(' '); }

  const ph = PHRASES[idx];
  capEl.querySelectorAll('span').forEach((s,i) => { const w = ph[i]; s.className = t < w[1] ? '' : (t < w[2]+.05 ? 'now' : 'past'); });
}

/* ---------- Waveform ---------- */
const BARS = [];
if (WAVE_ON) { const wv = el('div'); wv.id = 'wave'; wv.style.top = (CAP_ON ? capTop + (LAND?128:275) : H - 190)+'px'; stage.appendChild(wv);
  for (let i=0;i<41;i++) { const b = el('i'); wv.appendChild(b); BARS.push(b); } }

/* ---------- Per-frame render ---------- */
function render(t) {
  SCENES.forEach(({sc, s}) => { s.style.visibility = (t >= sc.start - .05 && t <= sc.end + .5) ? 'visible' : 'hidden'; });
  runAnims(t);
  HOOKS.forEach(h => h(t));
  const e = envAt(t);
  $('glow').style.transform = `scale(${.9 + e*.25 + Math.sin(t*.8)*.03})`;
  $('glow').style.opacity = .55 + e*.45;
  $('grid').style.transform = `translate(${(t*6)%60}px,${(t*10)%60}px)`;
  if (grainEl) grainEl.style.transform = `translate(${(Math.floor(t*24)*37)%256}px,${(Math.floor(t*24)*91)%256}px)`;
  let fl = 0; for (const f of FLASHES) fl = Math.max(fl, (1 - p(t, f, f + .25)) * (t >= f ? 1 : 0)); flashEl.style.opacity = fl * .85;
  if (HAND) scenesEl.style.transform = `translate(${wob(t,.9,1)*6*HAND}px,${wob(t,1.1,4)*5*HAND}px) rotate(${wob(t,.7,2)*.35*HAND}deg) scale(${1+.012*HAND})`;

    let o = 0; for (const [a,b] of BRAND_SPANS) o = Math.max(o, outExpo(p(t,a,a+.6)) * (1-inOut(p(t,b,b+.4))));
    brandEl.style.opacity = o; brandEl.style.transform = `translateY(${(1-o)*-20}px)`;
  }
  const idle = (t > AUD || !CFG.audio) ? 0 : 1;
  BARS.forEach((b,i) => { const off = Math.abs(i-20), v = envAt(t - off*.035) * idle;
    b.style.height = Math.max(6, 8 + v*(100 - off*2.6) + (idle ? 0 : 4 + Math.sin(t*3 + i*.5)*3))+'px'; b.style.opacity = .35 + v*.65 - off*.008; });
  renderCaptions(t);

/* Videos: exact seek per frame when rendering, drift correction when playing. */

/* ---------- Player ---------- */
const audio = $('voice'), prog = $('prog'), tc = $('tc'), big = $('big');
if (CFG.audio) audio.src = src(CFG.audio.src);
prog.max = DUR;
let t = CFG.poster ?? Math.max(0, DUR - 1.5), playing = false, startPerf = 0, startT = 0;
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit() {
  const fr = $('frame');

  const sc = Math.min((window.innerHeight - 90)/H, (window.innerWidth - 32)/W);

function setIcon() { $('ppi').innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; $('pp').setAttribute('aria-label', playing ? 'Pause' : 'Lecture'); }

function loop(now) {

big.addEventListener('click', play);
$('pp').addEventListener('click', () => playing ? pause() : play());
